<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark AI by Kunj Shah</title>
    <!-- Use Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="bot-info">
                <div class="bot-avatar">
                    <i class="fas fa-robot"></i>
                </div>
                <div>
                    <h2>Dark AI</h2>
                    <span class="status"><i class="fas fa-circle online-dot"></i> Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn"><i class="fas fa-ellipsis-v"></i></button>
            </div>
        </header>

        <div class="chat-messages" id="chatbox">
            <div class="message bot-message">
                <div class="message-content">
                    <p>Hello! I am Dark AI. I can search the web, open applications, and have a chat with you. How can I assist you today?</p>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <span></span><span></span><span></span>
        </div>

        <div class="chat-input-container">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit" id="send-btn"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
